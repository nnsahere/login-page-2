<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrasi abstrak bertema pixel dengan gradasi ungu, magenta, dan oranye">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2a0a63"/>
      <stop offset="0.45" stop-color="#a21f66"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- tangga pixel di sisi kanan -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="760" y="120" width="40" height="40"/>
    <rect x="720" y="160" width="80" height="40"/>
    <rect x="680" y="200" width="120" height="40"/>
    <rect x="720" y="240" width="80" height="40"/>
    <rect x="760" y="280" width="40" height="40"/>
  </g>

  <!-- kotak pixel tersebar -->
  <g fill="#ffffff">
    <rect x="70" y="90" width="28" height="28" opacity="0.9"/>
    <rect x="310" y="40" width="16" height="16" opacity="0.7"/>
    <rect x="540" y="70" width="22" height="22" opacity="0.8"/>
    <rect x="150" y="610" width="20" height="20" opacity="0.6"/>
    <rect x="620" y="560" width="30" height="30" opacity="0.75"/>
    <rect x="420" y="900" width="18" height="18" opacity="0.7"/>
    <rect x="40" y="820" width="34" height="34" opacity="0.8"/>
    <rect x="700" y="850" width="16" height="16" opacity="0.7"/>
  </g>

  <!-- bingkai dengan "handle" sudut ala poster -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2">
    <rect x="90" y="330" width="560" height="360"/>
  </g>
  <rect x="80" y="320" width="22" height="22" fill="#6d28d9"/>
  <rect x="638" y="320" width="22" height="22" fill="#ff6a2b"/>
  <rect x="80" y="678" width="22" height="22" fill="#ff6a2b"/>
  <rect x="638" y="678" width="22" height="22" fill="#6d28d9"/>

  <!-- blok pixel bawah -->
  <g>
    <rect x="0" y="940" width="60" height="60" fill="#2a0a63" opacity="0.55"/>
    <rect x="60" y="960" width="40" height="40" fill="#2a0a63" opacity="0.4"/>
    <rect x="740" y="940" width="60" height="60" fill="#6d28d9" opacity="0.6"/>
    <rect x="700" y="960" width="40" height="40" fill="#6d28d9" opacity="0.45"/>
  </g>
</svg>
